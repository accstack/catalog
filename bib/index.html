<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Word Stress Catalog · Bibliography</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="bib.css">
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><h1>Word Stress Catalog</h1><span class="sub" id="edition">Bibliography</span></div>
  <div class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg><input id="q" type="search" placeholder="Language, glottocode, family or author…" aria-label="Search"></div>
  <div class="actions">
    <a class="btn ghost" href="../index.html">Catalog</a><a class="btn ghost" href="../protocol.html" title="How the stress of each language was established and checked, and what the confidence levels mean">Protocol</a><a class="btn ghost" href="../faq.html" title="Questions readers ask about this catalog">FAQ</a>
    <button class="btn ghost filtersbtn" id="filtersbtn" aria-expanded="false">Filters</button>
    <button class="btn ghost" id="clear">Clear filters</button>
    <button class="btn" id="savecsv">Download this list as CSV</button>
  </div>
</header>
<aside class="rail" id="rail"></aside>
<main>
  <div class="summary"><span class="big" id="count">…</span><span id="countlabel">languages</span><span class="crit" id="crit">loading the bibliography…</span></div>
  <div class="chips" id="chips"></div>
  <div class="legend" id="legend"></div>
  <div class="tablewrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>No languages match these criteria.</div></div>
  <div class="pager" id="pager"></div>
  <p class="note" id="provnote"></p>
</main>
</div>
<div class="drawer" id="drawer" aria-hidden="true"><button class="close" id="dclose">Close</button><div id="dbody"></div></div>
<script src="bib.js"></script>
</body>
</html>
